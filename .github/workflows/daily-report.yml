name: Garmin Daily Training Report

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/daily-report.yml'
  schedule:
    # 00:00 UTC = 08:00 Asia/Shanghai. Change this UTC cron for another local run time.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional report date (YYYY-MM-DD); defaults to yesterday in TIMEZONE"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: garmin-daily-report
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Garmin activities and build report
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Shanghai' }}
          FTP_WATTS: ${{ vars.FTP_WATTS || '250' }}
          REPORT_DATE: ${{ github.event.inputs.report_date || '' }}
        run: python src/garmin_report.py

      - name: Commit daily report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/*.json reports/*.md
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Add Garmin report"
            git push
          fi
